<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161D2E">
<title>倒空 · Brain Detox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161D2E; --bg2:#1B2438; --ink:#E8E6F0; --sub:#8B93AD; --dim:#5A6280;
  --moon:#E8C98A; --moon2:#F5E3BC; --hair:rgba(232,230,240,.1);
  --bub:#232C44; --bub2:#2A3550;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;
  padding-bottom:150px;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(232,201,138,.07),transparent),
    radial-gradient(ellipse 60% 40% at 80% 110%,rgba(74,107,140,.12),transparent)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:calc(env(safe-area-inset-top) + 64px) 0 0;text-align:center}
.kicker{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:5px;color:var(--moon);opacity:.8}
h1{font-family:'Noto Serif SC',serif;font-size:40px;font-weight:600;letter-spacing:12px;margin-top:14px;color:var(--ink);white-space:nowrap}
h1 i{font-style:normal;color:var(--moon)}
.sub{font-family:'Noto Sans SC',sans-serif;font-size:12px;color:var(--sub);letter-spacing:2px;margin-top:10px}
.rule{width:40px;height:1px;background:var(--moon);opacity:.35;margin:24px auto 0}
.quote{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--dim);letter-spacing:1px;margin-top:18px;line-height:2.2}
.quote b{color:var(--sub);font-weight:500}

/* ============ 气泡池 ============ */
.pool{min-height:200px;margin-top:34px}
.pool-empty{text-align:center;color:var(--dim);font-size:13px;letter-spacing:2px;padding:50px 0;font-family:'Noto Sans SC',sans-serif}
.bubble{position:relative;background:linear-gradient(160deg,var(--bub),var(--bub2));border:1px solid var(--hair);
  border-radius:18px;padding:14px 16px 44px;margin:0 0 14px;animation:rise .5s ease-out;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bubble.gone{animation:floataway 1.6s ease-in forwards;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes floataway{
  0%{opacity:1;transform:none;filter:blur(0)}
  100%{opacity:0;transform:translateY(-46vh) translateX(var(--drift,-30px)) rotate(var(--rot,-6deg)) scale(.82);filter:blur(7px)}
}
.btext{font-family:'Noto Serif SC',serif;font-size:15px;line-height:1.9;color:var(--ink);word-break:break-word}
.btime{position:absolute;top:12px;right:14px;font-size:9.5px;color:var(--dim);letter-spacing:1px;font-family:'Noto Sans SC',sans-serif}
.bacts{position:absolute;bottom:10px;left:14px;right:14px;display:flex;gap:8px}
.bact{flex:1;border:1px solid var(--hair);background:transparent;color:var(--sub);border-radius:999px;
  font-size:11px;letter-spacing:1px;padding:5px 0;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .18s}
.bact:hover{color:var(--ink);border-color:var(--sub)}
.bact.keep{color:var(--moon);border-color:rgba(232,201,138,.35)}
.bact.keep:hover{color:var(--moon2);border-color:var(--moon)}

/* ============ 输入 ============ */
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(to top,var(--bg) 72%,transparent);
  padding:18px 20px calc(env(safe-area-inset-bottom) + 18px)}
.ibox{max-width:680px;margin:0 auto;display:flex;gap:10px}
#inp{flex:1;background:var(--bub);border:1px solid var(--hair);border-radius:999px;padding:14px 22px;color:var(--ink);
  font-family:'Noto Sans SC',sans-serif;font-size:14px;outline:none;transition:border .2s}
#inp:focus{border-color:rgba(232,201,138,.4)}
#inp::placeholder{color:var(--dim)}
#addBtn{border:none;background:var(--moon);color:#2A2410;border-radius:999px;padding:0 24px;font-weight:700;
  font-size:13.5px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif}
#addBtn:active{transform:scale(.95)}
.breath{text-align:center;font-family:'Noto Serif SC',serif;font-size:12px;color:var(--dim);letter-spacing:3px;margin-top:10px}

/* ============ 工具行 ============ */
.tools{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.tool{border:1px solid var(--hair);background:transparent;color:var(--sub);border-radius:999px;
  padding:8px 18px;font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s}
.tool:hover{color:var(--moon);border-color:rgba(232,201,138,.4)}
.tool b{color:var(--moon);font-weight:700}

/* ============ 折叠区 ============ */
.drawer{max-width:560px;margin:26px auto 0;display:none}
.drawer.on{display:block}
.dhead{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:3px;color:var(--dim);text-align:center;margin-bottom:10px}
.drow{display:flex;align-items:baseline;gap:10px;padding:9px 4px;border-bottom:1px solid var(--hair)}
.drow .t{flex:1;font-family:'Noto Serif SC',serif;font-size:13.5px;color:var(--ink2)}
.drow .d{font-size:10px;color:var(--dim);font-family:'Noto Sans SC',sans-serif;white-space:nowrap}
.drow.biz .t{color:var(--moon)}
.dclear{text-align:center;margin-top:12px}
.dclear button{border:none;background:none;color:var(--dim);font-size:11px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;text-decoration:underline;text-underline-offset:4px}
.dclear button:hover{color:var(--sub)}

footer{margin-top:70px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:2px;line-height:2.2;font-family:'Noto Sans SC',sans-serif}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,14px);z-index:60;background:var(--moon);color:#2A2410;
  padding:11px 24px;border-radius:999px;font-size:12.5px;letter-spacing:2px;opacity:0;pointer-events:none;transition:all .3s;font-family:'Noto Sans SC',sans-serif;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:420px){h1{font-size:32px;letter-spacing:8px}.btext{font-size:14px}}
</style>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="倒空">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Brain Detox · Midnight</div>
    <h1>倒<i>空</i></h1>
    <div class="sub">深夜脑内排污处 —— 想到什么，倒什么</div>
    <div class="rule"></div>
    <div class="quote">"大脑不是用来<b>装东西</b>的，是用来<b>想东西</b>的。"<br>—— David Allen</div>
  </header>

  <div class="pool" id="pool"><div class="pool-empty">脑子里很挤吗 —— 一条一条倒出来，交给这里</div></div>

  <div class="tools">
    <button class="tool" id="allGone">🌬 全部放走</button>
    <button class="tool" id="showKept">📝 放下的 <b id="keptN">0</b></button>
    <button class="tool" id="showBiz">💡 留给明天 <b id="bizN">0</b></button>
  </div>

  <div class="drawer" id="dKept">
    <div class="dhead">已经放下的（写下来 = 不再占内存）</div>
    <div id="keptList"></div>
    <div class="dclear"><button id="clearKept">清空这段记录</button></div>
  </div>
  <div class="drawer" id="dBiz">
    <div class="dhead">留给明天的正事（明天再管，今晚不管）</div>
    <div id="bizList"></div>
    <div class="dclear"><button id="clearBiz">明天的都办完了，清空</button></div>
  </div>

  <footer>
    放掉的不留痕，写下的不占脑。<br>
    <span class="fine">今晚到这里就好 · 睡前少看屏幕</span>
  </footer>
</div>

<div class="inputbar">
  <div class="ibox">
    <input id="inp" placeholder="现在，脑子里都装着什么？" autocomplete="off">
    <button id="addBtn">倒出来</button>
  </div>
  <div class="breath" id="breath">呼 —— 慢慢来</div>
</div>

<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const KEY="bd_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{kept:[],biz:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const CUR=[];      // 当前气泡（内存，不放 localStorage —— 放掉即消失）
let curKept="kept";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2000)}
const RELIEF=["呼 —— 轻了一点","又轻了一点","脑子里的房间，干净了一格","看见了，然后放下了","它来过，现在它可以走了","不急，一条一条来"];
const fmt=ts=>{const d=new Date(ts);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};

function renderPool(){
  const pool=$("#pool");
  if(!CUR.length){pool.innerHTML='<div class="pool-empty">空了 —— 这种感觉很珍贵，多待一会儿</div>';return}
  pool.innerHTML="";
  CUR.forEach((b,i)=>{
    const el=document.createElement("div");el.className="bubble";
    el.style.setProperty("--drift",(Math.random()*120-60)+"px");
    el.style.setProperty("--rot",(Math.random()*14-7)+"deg");
    el.innerHTML=`<div class="btime">${b.time}</div><div class="btext">${b.t}</div>
      <div class="bacts">
        <button class="bact" data-a="gone">🌬 放掉</button>
        <button class="bact keep" data-a="biz">💡 留给明天</button>
        <button class="bact" data-a="kept">📝 放下存档</button>
      </div>`;
    el.querySelectorAll(".bact").forEach(btn=>btn.addEventListener("click",e=>{
      const a=btn.dataset.a;
      el.classList.add("gone");
      setTimeout(()=>{CUR.splice(i,1);renderPool()},1600);
      if(a==="gone")toast(RELIEF[Math.floor(Math.random()*RELIEF.length)]);
      if(a==="biz"){S.biz.unshift({t:b.t,at:Date.now()});save();renderLists();toast("记下了 —— 明天再管，今晚不管")}
      if(a==="kept"){S.kept.unshift({t:b.t,at:Date.now()});save();renderLists();toast("写下来了 —— 它不再占你的脑子")}
    }));
    pool.appendChild(el);
  });
}
function renderLists(){
  $("#keptN").textContent=S.kept.length;$("#bizN").textContent=S.biz.length;
  $("#keptList").innerHTML=S.kept.map(x=>`<div class="drow"><span class="t">${x.t}</span><span class="d">${fmt(x.at)}</span></div>`).join("")||'<div class="drow"><span class="t" style="color:var(--dim)">空的</span></div>';
  $("#bizList").innerHTML=S.biz.map(x=>`<div class="drow biz"><span class="t">💡 ${x.t}</span><span class="d">${fmt(x.at)}</span></div>`).join("")||'<div class="drow"><span class="t" style="color:var(--dim)">今晚没有正事 —— 睡个好觉</span></div>';
}
function addBubble(){
  const v=$("#inp").value.trim();
  if(!v){$("#inp").focus();return}
  const poolEmpty=$("#pool .pool-empty");
  CUR.push({t:v,time:fmt(Date.now())});
  $("#inp").value="";
  if(poolEmpty)poolEmpty.remove();
  renderPool();
  $("#breath").textContent=["呼 —— ","再来，想到什么倒什么","还有吗","倒出来就轻了"][Math.floor(Math.random()*4)];
}
$("#addBtn").addEventListener("click",addBubble);
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")addBubble()});

$("#allGone").addEventListener("click",()=>{
  if(!CUR.length){toast("已经空了 —— 好好休息");return}
  const n=CUR.length;
  document.querySelectorAll(".bubble").forEach((el,i)=>{
    setTimeout(()=>el.classList.add("gone"),i*260);
  });
  setTimeout(()=>{CUR.length=0;renderPool();
    toast(`呼 —— ${n} 条全放走了`);
    $("#breath").textContent="深呼吸：吸 4 秒 · 屏 4 秒 · 呼 6 秒";
  },n*260+1700);
});
$("#showKept").addEventListener("click",()=>{
  curKept=curKept==="kept"?"":curKept||"kept";
  const on=$("#dKept").classList.toggle("on");
  if(on){$("#dBiz").classList.remove("on");$("#dKept").scrollIntoView({behavior:"smooth",block:"nearest"})}
});
$("#showBiz").addEventListener("click",()=>{
  const on=$("#dBiz").classList.toggle("on");
  if(on){$("#dKept").classList.remove("on");$("#dBiz").scrollIntoView({behavior:"smooth",block:"nearest"})}
});
$("#clearKept").addEventListener("click",()=>{if(!S.kept.length)return;if(!confirm("清空“放下的”记录？"))return;S.kept=[];save();renderLists();toast("轻装上阵")});
$("#clearBiz").addEventListener("click",()=>{if(!S.biz.length)return;if(!confirm("清空“留给明天的”？办完了才清哦"))return;S.biz=[];save();renderLists();toast("正事清零 —— 睡个好觉")});

renderLists();
</script>
</body>
</html>
